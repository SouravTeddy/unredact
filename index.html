<title>Unredact</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
  :root{
    --bg: #0d1210;
    --surface: #151c19;
    --surface-2: #1d2621;
    --ink: #edf3f0;
    --ink-dim: #9db0a8;
    --ink-faint: #5d7168;
    --accent: #5fd88a;
    --accent-ink: #06210f;
    --accent-2: #e0b155;
    --border: rgba(237,243,240,0.14);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0; background: var(--bg); color: var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    min-height:100dvh; display:flex; flex-direction:column;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }
  h1,h2{ font-family:'Rajdhani', sans-serif; font-weight:700; margin:0; }

  header{ padding:16px 18px 12px; border-bottom:1px solid var(--border); }
  .eyebrow{ color:var(--accent); font-size:0.68rem; letter-spacing:0.14em; text-transform:uppercase; font-family:'Rajdhani',sans-serif; font-weight:700; }
  h1{ font-size:1.5rem; margin-top:2px; }
  .sub{ color:var(--ink-dim); font-size:0.85rem; margin-top:4px; max-width:56ch; line-height:1.4; }

  main{ flex:1; display:flex; flex-direction:column; padding:16px 18px 24px; gap:16px; }

  #imageWrap{
    display:none; position:relative;
    border-radius:12px; background:#000; border:1px solid var(--border);
  }
  #imageWrap.active{ display:block; }

  #cropOverlay{ position:absolute; inset:0; }
  #cropBox{
    position:absolute; border:2px solid var(--accent-2); background:rgba(224,177,85,0.08);
    touch-action:none;
  }
  .handle{
    position:absolute; width:24px; height:24px; margin:-12px;
    background:var(--accent-2); border-radius:50%; touch-action:none;
    border:2px solid var(--bg);
  }
  .handle.tl{ top:0; left:0; } .handle.tr{ top:0; left:100%; }
  .handle.bl{ top:100%; left:0; } .handle.br{ top:100%; left:100%; }

  .mode-picker{ display:flex; gap:10px; }
  .mode-btn{
    flex:1; padding:14px 12px; border-radius:12px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); text-align:left; cursor:pointer;
  }
  .mode-btn.active{ border-color:var(--accent); background:var(--surface-2); }
  .mode-btn .label{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1rem; }
  .mode-btn .desc{ color:var(--ink-dim); font-size:0.75rem; margin-top:3px; line-height:1.35; }

  .tip-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; font-size:0.85rem; color:var(--ink-dim); line-height:1.5;
  }
  .tip-card b{ color:var(--ink); }

  .capture-row{ display:flex; gap:10px; }
  .btn{
    font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:0.03em;
    border:none; border-radius:10px; padding:13px 18px; cursor:pointer; font-size:0.95rem;
  }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); flex:1; }
  .btn.secondary{ background:transparent; border:1px solid var(--border); color:var(--ink-dim); }
  input[type=file]{ display:none; }

  canvas{ width:100%; display:block; }

  #stage{ display:none; flex-direction:column; gap:10px; }
  #stage.active{ display:flex; }

  .channel-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{
    flex:1; padding:9px 6px; text-align:center; border-radius:8px; border:1px solid var(--border);
    background:var(--surface); font-size:0.78rem; color:var(--ink-dim); cursor:pointer;
    font-family:'Rajdhani',sans-serif; font-weight:700; letter-spacing:0.04em;
  }
  .chip.active{ border-color:var(--accent-2); color:var(--ink); background:var(--surface-2); }
  .chip{ min-width:64px; }

  .slider-row{ display:flex; flex-direction:column; gap:4px; }
  .slider-row .val{ float:right; color:var(--accent-2); }
  .slider-row label{ font-size:0.72rem; color:var(--ink-faint); letter-spacing:0.05em; text-transform:uppercase; font-family:'Rajdhani',sans-serif; font-weight:600; }
  input[type=range]{ width:100%; accent-color: var(--accent); }

  .empty{ color:var(--ink-faint); font-size:0.85rem; text-align:center; padding:40px 20px; }
</style>

<main>
  <div class="capture-row">
    <button class="btn primary" id="captureBtn">📷 Take Photo</button>
    <button class="btn secondary" id="uploadBtn">Upload</button>
  </div>
  <input type="file" id="fileInput" accept="image/*" capture="environment">
  <div class="tip-card" id="frameCountBox" style="display:none;"></div>

  <div id="imageWrap">
    <canvas id="canvas"></canvas>
  </div>

  <div id="stage">
    <div id="dragHint"></div>

    <button class="btn secondary" id="resetBtn">↺ Take another photo</button>

    <button class="btn primary" id="revealBtn" style="width:100%; margin-top:8px;">🔎 Reveal Text (auto)</button>

    <div class="slider-row">
      <label>Strictness <span class="val mono" id="strictVal">50</span></label>
      <input type="range" id="strictSlider" min="0" max="100" value="50">
    </div>

    <div class="tip-card mono" id="diagBox" style="display:none; font-size:0.72rem;"></div>

    <label style="display:flex; align-items:center; gap:8px; font-size:0.78rem; color:var(--ink-dim); font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:4px 0;">
      <input type="checkbox" id="invertToggle" style="width:18px; height:18px;">
      Invert (swap which side counts as "text") — use with Strictness above
    </label>

    <div class="channel-row">
      <button class="btn secondary" id="denoiseBtn" style="flex:1;">🧩 Isolate stroke patterns (remove speckle noise)</button>
    </div>
    <div class="slider-row" id="denoiseParams" style="display:none;">
      <label>Minimum stroke size <span class="val mono" id="minSizeVal">6</span> px</label>
      <input type="range" id="minSizeSlider" min="2" max="60" value="6">
    </div>
    <div class="slider-row" id="extentParams" style="display:none;">
      <label>Max fill ratio, reject solid blobs <span class="val mono" id="extentVal">65</span>%</label>
      <input type="range" id="extentSlider" min="20" max="100" value="65">
    </div>

    <div id="chunkStripLabel" style="display:none; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.72rem; color:var(--ink-faint); letter-spacing:0.05em; text-transform:uppercase;">Pattern chunks, left to right</div>
    <div id="chunkStrip" style="display:none; overflow-x:auto; gap:6px; padding:8px 0; -webkit-overflow-scrolling:touch;"></div>
    <button class="btn primary" id="openCollageBtn" style="display:none;">🧲 Open movable collage in new tab</button>

    <div class="channel-row">
      <button class="btn secondary" id="ocrBtn" style="flex:1;">🔤 Try OCR on this result</button>
    </div>
    <div class="tip-card mono" id="ocrBox" style="display:none; font-size:0.72rem;"></div>

    <div class="channel-row">
      <button class="btn primary" id="addFrameBtn" style="flex:1;">📷 Add another shot of the same spot</button>
      <button class="btn secondary" id="averageBtn" style="display:none;">🧮 Average &amp; analyze</button>
    </div>

    <details id="advancedDetails">
      <summary style="cursor:pointer; color:var(--ink-dim); font-family:'Rajdhani',sans-serif; font-weight:700; font-size:0.82rem; letter-spacing:0.04em; text-transform:uppercase; padding:8px 0;">Manual channel/levels controls</summary>

        <div class="channel-row" id="channelRow" style="margin-top:8px;">
          <div class="chip active" data-ch="auto">AUTO ✦</div>
          <div class="chip" data-ch="r">RED</div>
          <div class="chip" data-ch="g">GREEN</div>
          <div class="chip" data-ch="b">BLUE</div>
          <div class="chip" data-ch="rg">R−G</div>
          <div class="chip" data-ch="rb">R−B</div>
          <div class="chip" data-ch="gb">G−B</div>
          <div class="chip" data-ch="sat">SAT</div>
          <div class="chip" data-ch="val">VAL</div>
        </div>

        <div class="slider-row">
          <label>Black point <span class="val mono" id="blackVal">0</span></label>
          <input type="range" id="blackSlider" min="0" max="255" value="0">
        </div>
        <div class="slider-row">
          <label>White point <span class="val mono" id="whiteVal">255</span></label>
          <input type="range" id="whiteSlider" min="0" max="255" value="255">
        </div>

        <div class="channel-row">
          <div class="chip" id="binarizeToggle" style="flex:1;">🔲 Sharpen text (adaptive threshold)</div>
        </div>
        <div class="slider-row" id="binarizeParams" style="display:none;">
          <label>Sensitivity <span class="val mono" id="sensVal">6</span></label>
          <input type="range" id="sensSlider" min="1" max="60" value="6">
        </div>
      </details>
  </div>

  <div class="empty" id="emptyState">No photo yet — take or upload one to see the result here.</div>
</main>

<script>
(function(){
  var fileInput = document.getElementById('fileInput');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var stage = document.getElementById('stage');
  var imageWrap = document.getElementById('imageWrap');
  var emptyState = document.getElementById('emptyState');

  var fullImageData = null; // the whole uploaded photo

  var invertOutput = false;
  document.getElementById('invertToggle').addEventListener('change', function(e){
    invertOutput = e.target.checked;
    if (confidenceCache) renderConfidence();
  });

  var chips = document.querySelectorAll('.chip');
  var blackSlider = document.getElementById('blackSlider');
  var whiteSlider = document.getElementById('whiteSlider');
  var blackVal = document.getElementById('blackVal');
  var whiteVal = document.getElementById('whiteVal');

  var originalImageData = null;
  var channelValues = null; // Uint8ClampedArray, one value per pixel, for the currently selected channel/diff
  var activeChannel = 'auto';
  var binarizeOn = false;
  var binarizeToggle = document.getElementById('binarizeToggle');
  var binarizeParams = document.getElementById('binarizeParams');
  var sensSlider = document.getElementById('sensSlider');
  var sensVal = document.getElementById('sensVal');

  // fast separable box blur via sliding window, operates on a Float64Array in place -> returns new Float64Array
  function boxBlur(src, w, h, radius){
    var tmp = new Float64Array(src.length);
    var out = new Float64Array(src.length);
    var windowSize = radius*2+1;
    // horizontal pass
    for (var y=0;y<h;y++){
      var rowStart = y*w;
      var sum = 0;
      for (var x=-radius;x<=radius;x++){
        var xi = Math.min(w-1, Math.max(0,x));
        sum += src[rowStart+xi];
      }
      for (var x=0;x<w;x++){
        tmp[rowStart+x] = sum/windowSize;
        var addX = Math.min(w-1, x+radius+1);
        var subX = Math.max(0, x-radius);
        sum += src[rowStart+addX] - src[rowStart+subX];
      }
    }
    // vertical pass
    for (var x=0;x<w;x++){
      var sum2 = 0;
      for (var y=-radius;y<=radius;y++){
        var yi = Math.min(h-1, Math.max(0,y));
        sum2 += tmp[yi*w+x];
      }
      for (var y=0;y<h;y++){
        out[y*w+x] = sum2/windowSize;
        var addY = Math.min(h-1, y+radius+1);
        var subY = Math.max(0, y-radius);
        sum2 += tmp[addY*w+x] - tmp[subY*w+x];
      }
    }
    return out;
  }

  var capturedFrames = []; // array of ImageData, all same w/h, for multi-shot averaging
  var fixedW = null, fixedH = null;
  var isAddingFrame = false;
  var frameCountBox = document.getElementById('frameCountBox');
  var averageBtn = document.getElementById('averageBtn');

  document.getElementById('captureBtn').addEventListener('click', function(){
    isAddingFrame = false;
    fileInput.setAttribute('capture','environment');
    fileInput.click();
  });
  document.getElementById('uploadBtn').addEventListener('click', function(){
    isAddingFrame = false;
    fileInput.removeAttribute('capture');
    fileInput.click();
  });
  document.getElementById('addFrameBtn').addEventListener('click', function(){
    isAddingFrame = true;
    fileInput.setAttribute('capture','environment');
    fileInput.click();
  });

  function updateFrameCountUI(){
    if (capturedFrames.length >= 1){
      frameCountBox.style.display = 'block';
      frameCountBox.innerHTML = '<b>' + capturedFrames.length + '</b> shot' + (capturedFrames.length>1?'s':'') + ' of this spot captured. Keep the phone and paper still, add 2-3 more of the exact same spot, then average them to cancel out camera noise.';
    }
    averageBtn.style.display = capturedFrames.length >= 2 ? 'inline-block' : 'none';
  }

  // Simplified exposure fusion (Mertens-style well-exposedness weighting, single-scale).
  // Rather than blindly averaging N shots (which just repeats the same clipping if every
  // shot is exposed the same way), this weights each frame's contribution per-pixel by how
  // "well exposed" that pixel is in that frame — a pixel that's blown-out white or crushed
  // black in one shot gets near-zero weight there, letting a differently-exposed shot's
  // good data for that same spot dominate instead. Works best when the shots you add are
  // actually taken at different brightness/exposure, not identical repeats.
  function wellExposedWeight(r,g,b){
    var sigma = 0.2;
    var wr = Math.exp(-Math.pow((r/255-0.5),2)/(2*sigma*sigma));
    var wg = Math.exp(-Math.pow((g/255-0.5),2)/(2*sigma*sigma));
    var wb = Math.exp(-Math.pow((b/255-0.5),2)/(2*sigma*sigma));
    return wr*wg*wb;
  }

  averageBtn.addEventListener('click', function(){
    var n = capturedFrames.length;
    var len = capturedFrames[0].data.length;
    var fused = new Uint8ClampedArray(len);
    var eps = 0.01; // keeps a degenerate all-badly-exposed pixel from dividing by ~0
    for (var i=0;i<len;i+=4){
      var sr=0, sg=0, sb=0, sw=0;
      for (var f=0; f<n; f++){
        var d = capturedFrames[f].data;
        var r=d[i], g=d[i+1], b=d[i+2];
        var w = wellExposedWeight(r,g,b) + eps;
        sr += r*w; sg += g*w; sb += b*w; sw += w;
      }
      fused[i] = sr/sw; fused[i+1] = sg/sw; fused[i+2] = sb/sw; fused[i+3] = 255;
    }
    var fusedImg = new ImageData(fused, fixedW, fixedH);
    canvas.width = fixedW; canvas.height = fixedH;
    ctx.putImageData(fusedImg, 0, 0);
    originalImageData = fusedImg;
    frameCountBox.innerHTML = '<b>Fused ' + n + ' shots</b> (weighted by how well-exposed each pixel was in each shot). Result below.';
    confidenceCache = null;
    runReveal();
  });

  fileInput.addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    var img = new Image();
    img.onload = function(){
      if (!isAddingFrame || fixedW === null){
        var maxW = Math.min(1000, img.width);
        var scale = maxW / img.width;
        fixedW = maxW;
        fixedH = Math.round(img.height * scale);
        capturedFrames = [];
      }
      canvas.width = fixedW; canvas.height = fixedH;
      ctx.drawImage(img, 0, 0, fixedW, fixedH);
      fullImageData = ctx.getImageData(0,0,fixedW,fixedH);
      originalImageData = fullImageData;
      if (!capturedFrames.length) capturedFrames.push(fullImageData);
      confidenceCache = null;
      imageWrap.classList.add('active');
      document.querySelector('main').classList.add('photo-active');
      emptyState.style.display = 'none';
      stage.classList.add('active');
    };
    img.src = URL.createObjectURL(file);
  });

  // extract a single grayscale-ish value per pixel for the requested channel/diff mode
  function extractChannel(ch){
    var src = originalImageData.data;
    var n = src.length/4;
    var out = new Float64Array(n);
    for (var i=0, p=0; i<src.length; i+=4, p++){
      var r=src[i], g=src[i+1], b=src[i+2];
      switch(ch){
        case 'r': out[p]=r; break;
        case 'g': out[p]=g; break;
        case 'b': out[p]=b; break;
        case 'rg': out[p]=Math.abs(r-g); break;
        case 'rb': out[p]=Math.abs(r-b); break;
        case 'gb': out[p]=Math.abs(g-b); break;
        case 'sat': out[p]=rgbToSat(r,g,b); break;
        case 'val': out[p]=Math.max(r,g,b); break;
      }
    }
    return out;
  }

  // HSV saturation, scaled to 0-255. High = strongly colored (e.g. a marker/highlighter tint).
  // Low = neutral gray/black/white (e.g. plain ink or paper), regardless of which hue the tint is.
  function rgbToSat(r,g,b){
    var max = Math.max(r,g,b), min = Math.min(r,g,b);
    if (max === 0) return 0;
    return ((max-min)/max) * 255;
  }

  // ---- Confidence-sweep engine ----
  // Real ink should read as "darker than its surroundings" across a WIDE range
  // of threshold choices, in multiple color channels — it's a robust, stable
  // property of the pixel. Noise/artifacts are threshold-sensitive: nudge the
  // cutoff slightly and they flicker in and out unpredictably. So instead of
  // picking one threshold per channel and trusting it, this sweeps each of the
  // 8 channels across 9 sensitivity levels (72 trials total) and records, per
  // pixel, what FRACTION of all those trials called it "text". That fraction
  // is a continuous confidence score, not a single fragile yes/no — exactly
  // suited to a partial, noisy reveal rather than expecting a clean 100%.
  var confidenceCache = null;
  var revealBtn = document.getElementById('revealBtn');
  var strictSlider = document.getElementById('strictSlider');
  var strictVal = document.getElementById('strictVal');
  var diagBoxTop = document.getElementById('diagBox');

  function computeConfidenceMap(){
    var w = originalImageData.width, h = originalImageData.height;
    var n = w*h;
    var accum = new Float64Array(n);
    var trials = 0;
    // Fixed pixel radius, not scaled to image size — cropping selects a
    // sub-region at the same resolution, it doesn't change how many pixels
    // wide an actual stroke is, so this shouldn't shrink just because you
    // cropped tighter. 14px is a reasonable middle ground for handwriting
    // stroke width at typical phone-camera resolution.
    var radius = 14;
    var channelKeys = ['r','g','b','val','sat','rg','rb','gb'];
    var sensLevels = [4,8,12,16,20,26,32,40,50];
    channelKeys.forEach(function(ch){
      var vals = extractChannel(ch);
      var min=Infinity, max=-Infinity;
      for (var i=0;i<vals.length;i++){ if(vals[i]<min)min=vals[i]; if(vals[i]>max)max=vals[i]; }
      var range = Math.max(1, max-min);
      var stretched = new Float64Array(vals.length);
      for (var i2=0;i2<vals.length;i2++){ stretched[i2] = (vals[i2]-min)/range*255; }
      var localAvg = boxBlur(stretched, w, h, radius);
      sensLevels.forEach(function(sens){
        trials++;
        for (var p=0;p<stretched.length;p++){
          if (stretched[p] < localAvg[p]-sens) accum[p]++;
        }
      });
    });
    var confidence = new Float64Array(n);
    for (var p2=0;p2<n;p2++) confidence[p2] = accum[p2]/trials; // 0..1
    return confidence;
  }

  function renderConfidence(){
    if (!confidenceCache) return;
    var strictness = parseInt(strictSlider.value,10) / 100; // 0..1
    var softness = 0.15; // width of the gray transition zone, fixed
    var w = originalImageData.width, h = originalImageData.height;
    var out = ctx.createImageData(w,h);
    var od = out.data;
    var strongCount = 0;
    for (var p=0, j=0; p<confidenceCache.length; p++, j+=4){
      var c = confidenceCache[p];
      var t = (c - strictness + softness) / (2*softness); // 0..1 ramp around the threshold
      t = Math.max(0, Math.min(1, t));
      var v = 255 * (1 - t); // higher confidence -> darker
      if (invertOutput) v = 255 - v; // swap which side of the threshold reads as dark
      if (v < 128) strongCount++;
      od[j]=od[j+1]=od[j+2]=v; od[j+3]=255;
    }
    ctx.putImageData(out,0,0);
    diagBoxTop.style.display = 'block';
    diagBoxTop.textContent = 'strongly flagged: ' + (strongCount/confidenceCache.length*100).toFixed(1)
      + '% of pixels | required confidence: ' + Math.round(strictness*100) + '% agreement across 72 threshold trials'
      + (invertOutput ? ' | inverted' : '');
  }

  function runReveal(){
    confidenceCache = computeConfidenceMap();
    renderConfidence();
  }

  // Sliders fire many 'input' events per drag gesture — re-running an
  // expensive whole-image render on every single one is what made dragging
  // feel slow. This coalesces rapid-fire events down to at most one render
  // per animation frame, which is plenty smooth and far cheaper.
  function rafThrottle(fn){
    var scheduled = false;
    return function(){
      if (scheduled) return;
      scheduled = true;
      requestAnimationFrame(function(){ scheduled = false; fn(); });
    };
  }

  revealBtn.addEventListener('click', runReveal);
  var throttledRenderConfidence = rafThrottle(function(){ if (confidenceCache) renderConfidence(); });
  strictSlider.addEventListener('input', function(){
    strictVal.textContent = strictSlider.value;
    throttledRenderConfidence();
  });

  // ---- Connected-component denoising ("despeckle") ----
  // Real ink strokes form coherent, connected shapes of a plausible size.
  // Camera/JPEG noise tends to show up as small, isolated, disconnected specks.
  // This labels every connected blob of "flagged as text" pixels, measures its
  // size, and throws away anything too small to plausibly be a real stroke —
  // a standard technique in document-scanner software, applied here on top of
  // the confidence map instead of a single hard threshold.
  var minSizeSlider = document.getElementById('minSizeSlider');
  var minSizeVal = document.getElementById('minSizeVal');
  var denoiseParams = document.getElementById('denoiseParams');
  var extentSlider = document.getElementById('extentSlider');
  var extentVal = document.getElementById('extentVal');
  var extentParams = document.getElementById('extentParams');
  var diagBox2 = document.getElementById('diagBox');

  // Pure, parameterized version of the whole reveal->denoise pipeline — no DOM
  // reads, so it can be called in a loop with many different settings (used by
  // the one-tap "Find The Word" flow below), as well as by the manual sliders.
  function computeFilteredBinarized(confidence, strictness, minSize, maxExtent, w, h){
    var softness = 0.15;
    var isBlack = new Uint8Array(w*h);
    for (var p=0;p<confidence.length;p++){
      var c = confidence[p];
      var t = (c - strictness + softness)/(2*softness);
      t = Math.max(0, Math.min(1,t));
      isBlack[p] = (255*(1-t)) < 128 ? 1 : 0;
    }
    var labels = new Int32Array(w*h).fill(-1);
    var sizes = [];
    var bboxes = [];
    var stack = [];
    var nextLabel = 0;
    for (var start=0; start<w*h; start++){
      if (isBlack[start] && labels[start]===-1){
        stack.length = 0;
        stack.push(start);
        labels[start] = nextLabel;
        var size = 0;
        var minX=w, maxX=0, minY=h, maxY=0;
        while (stack.length){
          var idx = stack.pop();
          size++;
          var x = idx % w, y = (idx - x) / w;
          if (x<minX) minX=x; if (x>maxX) maxX=x;
          if (y<minY) minY=y; if (y>maxY) maxY=y;
          if (x>0 && isBlack[idx-1] && labels[idx-1]===-1){ labels[idx-1]=nextLabel; stack.push(idx-1); }
          if (x<w-1 && isBlack[idx+1] && labels[idx+1]===-1){ labels[idx+1]=nextLabel; stack.push(idx+1); }
          if (y>0 && isBlack[idx-w] && labels[idx-w]===-1){ labels[idx-w]=nextLabel; stack.push(idx-w); }
          if (y<h-1 && isBlack[idx+w] && labels[idx+w]===-1){ labels[idx+w]=nextLabel; stack.push(idx+w); }
        }
        sizes.push(size);
        bboxes.push({minX:minX,maxX:maxX,minY:minY,maxY:maxY});
        nextLabel++;
      }
    }
    var minArea = minSize*minSize;
    function isKept(i){
      var bboxArea = (bboxes[i].maxX-bboxes[i].minX+1) * (bboxes[i].maxY-bboxes[i].minY+1);
      var extent = sizes[i] / bboxArea;
      return sizes[i] >= minArea && extent <= maxExtent;
    }
    var out = new ImageData(w,h);
    var od = out.data;
    for (var p2=0, j=0; p2<w*h; p2++, j+=4){
      var lbl = labels[p2];
      var keep = lbl>=0 && isKept(lbl);
      var v = keep ? 0 : 255;
      od[j]=od[j+1]=od[j+2]=v; od[j+3]=255;
    }
    var keptComponents = 0;
    for (var ci=0; ci<sizes.length; ci++) if (isKept(ci)) keptComponents++;
    return { imageData: out, sizes: sizes, bboxes: bboxes, isKept: isKept, nextLabel: nextLabel, keptComponents: keptComponents };
  }

  function runDenoise(){
    if (!confidenceCache) return;
    var w = originalImageData.width, h = originalImageData.height;
    var strictness = parseInt(strictSlider.value,10)/100;
    var minSize = parseInt(minSizeSlider.value,10);
    var maxExtent = parseInt(extentSlider.value,10)/100;
    var r = computeFilteredBinarized(confidenceCache, strictness, minSize, maxExtent, w, h);
    ctx.putImageData(r.imageData, 0, 0);
    diagBox2.style.display = 'block';
    diagBox2.textContent = 'found ' + r.nextLabel + ' connected blobs | kept ' + r.keptComponents
      + ' as stroke-shaped (size>=' + minSize*minSize + 'px, fill<=' + Math.round(maxExtent*100) + '%) | removed ' + (r.nextLabel-r.keptComponents) + ' as noise';
    renderChunkStrip(r.imageData, w, h, r.sizes, r.bboxes, r.isKept);
  }

  // ---- Pattern chunks: crop each surviving stroke into its own tile so you
  // can inspect them without surrounding noise. Also stashes each tile as a
  // data URL for the interactive collage (opened in a new tab), where you can
  // drag pieces next to each other or delete ones that are clearly noise —
  // since a human eye piecing shapes together has repeatedly done better here
  // than any automated matching. ----
  var chunkStrip = document.getElementById('chunkStrip');
  var chunkStripLabel = document.getElementById('chunkStripLabel');
  var openCollageBtn = document.getElementById('openCollageBtn');
  // Stashed, not eagerly converted to data URLs — toDataURL() is expensive
  // (PNG encoding) and doing it for every tile on every slider tweak is what
  // was freezing the page. Only generate the actual images when the collage
  // is opened, from whatever is currently kept.
  var lastKeptBoxes = [];
  var lastBinarized = null, lastW = 0, lastH = 0;

  function makeTileCanvas(binarizedImageData, w, h, bb, pad){
    var x0 = Math.max(0, bb.minX-pad), y0 = Math.max(0, bb.minY-pad);
    var x1 = Math.min(w, bb.maxX+pad+1), y1 = Math.min(h, bb.maxY+pad+1);
    var cw = x1-x0, ch = y1-y0;
    if (cw < 1 || ch < 1) return null; // guard against degenerate edge boxes
    var tileCanvas = document.createElement('canvas');
    tileCanvas.width = cw; tileCanvas.height = ch;
    var tctx = tileCanvas.getContext('2d');
    var tileData = tctx.createImageData(cw, ch);
    for (var yy=0; yy<ch; yy++){
      for (var xx=0; xx<cw; xx++){
        var srcIdx = ((y0+yy)*w + (x0+xx)) * 4;
        var dstIdx = (yy*cw + xx) * 4;
        tileData.data[dstIdx] = binarizedImageData.data[srcIdx];
        tileData.data[dstIdx+1] = binarizedImageData.data[srcIdx+1];
        tileData.data[dstIdx+2] = binarizedImageData.data[srcIdx+2];
        tileData.data[dstIdx+3] = 255;
      }
    }
    tctx.putImageData(tileData, 0, 0);
    return tileCanvas;
  }

  function renderChunkStrip(binarizedImageData, w, h, sizes, bboxes, isKept){
    chunkStrip.innerHTML = '';
    var kept = [];
    for (var i=0;i<sizes.length;i++){
      if (isKept(i)) kept.push(bboxes[i]);
    }
    if (!kept.length){
      chunkStrip.style.display = 'none';
      chunkStripLabel.style.display = 'none';
      openCollageBtn.style.display = 'none';
      lastKeptBoxes = [];
      return;
    }
    kept.sort(function(a,b){ return a.minX - b.minX; });
    lastKeptBoxes = kept;
    lastBinarized = binarizedImageData; lastW = w; lastH = h;
    var displayH = 72; // fixed display height per tile, upscaled for visibility
    kept.forEach(function(bb){
      var tileCanvas = makeTileCanvas(binarizedImageData, w, h, bb, 4);
      if (!tileCanvas) return;
      tileCanvas.style.height = displayH + 'px';
      tileCanvas.style.width = 'auto';
      tileCanvas.style.imageRendering = 'pixelated';
      tileCanvas.style.border = '1px solid var(--border)';
      tileCanvas.style.borderRadius = '6px';
      tileCanvas.style.background = '#fff';
      tileCanvas.style.flex = '0 0 auto';
      chunkStrip.appendChild(tileCanvas);
    });
    chunkStrip.style.display = 'flex';
    chunkStripLabel.style.display = 'block';
    openCollageBtn.style.display = 'block';
  }

  function yieldToBrowser(){ return new Promise(function(res){ setTimeout(res, 0); }); }

  openCollageBtn.addEventListener('click', async function(){
    // Generate every tile, no cap — but chunked with yields back to the
    // browser between batches, so the page stays responsive and shows real
    // progress instead of looking frozen while it works.
    var total = lastKeptBoxes.length;
    if (!total) return;
    openCollageBtn.disabled = true;
    var lastChunkTiles = [];
    var BATCH = 15;
    for (var i=0; i<total; i++){
      var tileCanvas = makeTileCanvas(lastBinarized, lastW, lastH, lastKeptBoxes[i], 4);
      if (tileCanvas) lastChunkTiles.push({ dataUrl: tileCanvas.toDataURL(), w: tileCanvas.width, h: tileCanvas.height });
      if (i % BATCH === 0){
        openCollageBtn.textContent = '🧲 Preparing ' + (i+1) + ' / ' + total + '...';
        await yieldToBrowser();
      }
    }
    openCollageBtn.disabled = false;
    openCollageBtn.textContent = '🧲 Open movable collage in new tab';

    if (!lastChunkTiles.length) return;
    var win = window.open('', '_blank');
    if (!win){ alert('Pop-up blocked — allow pop-ups for this site and try again.'); return; }
    // Wrapping grid of starting positions (not one long unscrollable row) so
    // every piece is reachable regardless of how many there are.
    var perRow = 8;
    var cellW = 100, cellH = 110;
    var pieceHtml = lastChunkTiles.map(function(tile, i){
      var col = i % perRow, row = Math.floor(i/perRow);
      var left = 16 + col * cellW;
      var top = 16 + row * cellH;
      return '<div class="piece" style="left:' + left + 'px; top:' + top + 'px;" data-i="' + i + '">'
        + '<img src="' + tile.dataUrl + '" draggable="false" style="height:80px;">'
        + '<button class="del">×</button>'
        + '</div>';
    }).join('');
    var boardW = Math.max(window.innerWidth, perRow*cellW + 32);
    var boardH = Math.max(window.innerHeight, Math.ceil(total/perRow)*cellH + 32);
    var doc = '<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1">'
      + '<title>Collage</title><style>'
      + 'html,body{margin:0;background:#1a1a1a;touch-action:pan-x pan-y;}'
      + '#board{position:relative;width:' + boardW + 'px;height:' + boardH + 'px;}'
      + '.piece{position:absolute;touch-action:none;cursor:grab;background:#fff;border-radius:6px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,0.4);}'
      + '.piece img{display:block;image-rendering:pixelated;pointer-events:none;}'
      + '.piece .del{position:absolute;top:-10px;right:-10px;width:22px;height:22px;border-radius:50%;border:none;background:#e0574a;color:#fff;font-size:14px;line-height:22px;text-align:center;cursor:pointer;padding:0;}'
      + '.piece.dragging{cursor:grabbing;z-index:1000;box-shadow:0 8px 20px rgba(0,0,0,0.5);}'
      + '#hint{position:fixed;top:8px;left:50%;transform:translateX(-50%);color:#999;font:12px sans-serif;text-align:center;z-index:1001;background:#1a1a1acc;padding:4px 10px;border-radius:6px;}'
      + '</style></head><body>'
      + '<div id="hint">' + total + ' pieces. Scroll to see them all. Drag to arrange, tap × to delete.</div>'
      + '<div id="board">' + pieceHtml + '</div>'
      + '<script>'
      + '(function(){'
      + 'function bind(el){'
      + '  var drag=null, offX=0, offY=0;'
      + '  el.addEventListener("pointerdown", function(e){'
      + '    if (e.target.classList.contains("del")) return;'
      + '    drag = el; el.classList.add("dragging");'
      + '    var r = el.getBoundingClientRect();'
      + '    offX = e.clientX - r.left; offY = e.clientY - r.top;'
      + '    el.setPointerCapture(e.pointerId);'
      + '  });'
      + '  el.addEventListener("pointermove", function(e){'
      + '    if (!drag) return;'
      + '    el.style.left = (e.clientX - offX + window.scrollX) + "px";'
      + '    el.style.top = (e.clientY - offY + window.scrollY) + "px";'
      + '  });'
      + '  el.addEventListener("pointerup", function(){ drag=null; el.classList.remove("dragging"); });'
      + '  el.querySelector(".del").addEventListener("click", function(){ el.remove(); });'
      + '}'
      + 'Array.prototype.forEach.call(document.querySelectorAll(".piece"), bind);'
      + '})();'
      + '<\/script></body></html>';
    win.document.write(doc);
    win.document.close();
  });

  document.getElementById('denoiseBtn').addEventListener('click', function(){
    denoiseParams.style.display = 'flex';
    extentParams.style.display = 'flex';
    runDenoise();
  });
  var throttledDenoise = rafThrottle(runDenoise);
  minSizeSlider.addEventListener('input', function(){
    minSizeVal.textContent = minSizeSlider.value;
    throttledDenoise();
  });
  extentSlider.addEventListener('input', function(){
    extentVal.textContent = extentSlider.value;
    throttledDenoise();
  });

  // Tesseract's own layout analysis behaves worse when text runs right up to
  // the image edge with zero margin — much more likely once you're feeding it
  // a tightly cropped snippet instead of a whole page. Padding a plain white
  // border around whatever's on the canvas before OCR is a cheap, real fix.
  function withWhiteMargin(srcCanvas, margin){
    var padded = document.createElement('canvas');
    padded.width = srcCanvas.width + margin*2;
    padded.height = srcCanvas.height + margin*2;
    var pctx = padded.getContext('2d');
    pctx.fillStyle = '#fff';
    pctx.fillRect(0,0,padded.width,padded.height);
    pctx.drawImage(srcCanvas, margin, margin);
    return padded.toDataURL();
  }

  // ---- OCR attempt via Tesseract.js ----
  // Runs the actual open-source Tesseract OCR engine (WebAssembly build) on
  // whatever's currently drawn on the canvas. This can only recognize genuine
  // structure that's actually there — it won't invent words from noise — but
  // it's a real, independent second opinion on whether what's left reads as
  // actual characters, which is a more direct test than eyeballing pixels.
  document.getElementById('ocrBtn').addEventListener('click', async function(){
    var ocrBox = document.getElementById('ocrBox');
    ocrBox.style.display = 'block';
    ocrBox.textContent = 'Running OCR... first run downloads the language model (a few MB), can take a moment.';
    try {
      var dataUrl = withWhiteMargin(canvas, 24);
      var result = await Tesseract.recognize(dataUrl, 'eng');
      var text = (result.data.text || '').trim();
      var conf = result.data.confidence;
      ocrBox.textContent = text
        ? ('OCR guess (confidence ' + conf.toFixed(0) + '%): "' + text + '"')
        : ('OCR found nothing it recognized as text (confidence ' + conf.toFixed(0) + '%).');
    } catch(e){
      ocrBox.textContent = 'OCR failed to run: ' + e.message;
    }
  });

  function stdDevOf(arr){
    var n=arr.length, sum=0, sumSq=0;
    for (var i=0;i<n;i++){ sum+=arr[i]; sumSq+=arr[i]*arr[i]; }
    var mean=sum/n;
    return Math.sqrt(Math.max(0,sumSq/n - mean*mean));
  }

  function pickBestChannelAndCompute(){
    var ch = activeChannel;
    if (ch === 'auto'){
      var candidates = ['r','g','b'];
      var bestCh = 'r', bestStd = -1;
      candidates.forEach(function(c){
        var vals = extractChannel(c);
        var sd = stdDevOf(vals);
        if (sd > bestStd){ bestStd = sd; bestCh = c; }
      });
      ch = bestCh;
    }
    channelValues = extractChannel(ch);

    var min=255, max=0;
    for (var i=0;i<channelValues.length;i++){
      var v = channelValues[i];
      if (v<min) min=v; if (v>max) max=v;
    }
    blackSlider.value = Math.max(0, Math.round(min));
    whiteSlider.value = Math.min(255, Math.round(max));
    blackVal.textContent = blackSlider.value;
    whiteVal.textContent = whiteSlider.value;
    render();
  }

  function render(){
    if (!channelValues) return;
    var black = parseInt(blackSlider.value,10);
    var white = parseInt(whiteSlider.value,10);
    if (white <= black) white = black+1;
    var range = white-black;
    var w = originalImageData.width, h = originalImageData.height;

    var stretched = new Float64Array(channelValues.length);
    for (var p=0;p<channelValues.length;p++){
      var v = ((channelValues[p]-black)/range)*255;
      stretched[p] = Math.max(0, Math.min(255, v));
    }

    var out = ctx.createImageData(w,h);
    var od = out.data;

    if (binarizeOn){
      // Fixed pixel radius, not scaled to image size — cropping selects a
    // sub-region at the same resolution, it doesn't change how many pixels
    // wide an actual stroke is, so this shouldn't shrink just because you
    // cropped tighter. 14px is a reasonable middle ground for handwriting
    // stroke width at typical phone-camera resolution.
    var radius = 14;
      var localAvg = boxBlur(stretched, w, h, radius);
      var sensitivity = parseInt(sensSlider.value,10);
      var textCount = 0;
      var minDiff = Infinity, maxDiff = -Infinity;
      for (var p2=0, j2=0; p2<stretched.length; p2++, j2+=4){
        var diff = localAvg[p2] - stretched[p2];
        if (diff<minDiff) minDiff=diff; if (diff>maxDiff) maxDiff=diff;
        var isText = stretched[p2] < (localAvg[p2] - sensitivity);
        if (isText) textCount++;
        var val = isText ? 0 : 255;
        od[j2]=od[j2+1]=od[j2+2]=val; od[j2+3]=255;
      }
      var diagBox = document.getElementById('diagBox');
      diagBox.style.display = 'block';
      var pct = (textCount/(stretched.length)*100).toFixed(1);
      diagBox.textContent = 'flagged as text: ' + pct + '% of pixels | local contrast range seen: ' + minDiff.toFixed(1) + ' to ' + maxDiff.toFixed(1) + ' (sensitivity=' + sensitivity + ')';
    } else {
      document.getElementById('diagBox').style.display = 'none';
      for (var p3=0, j3=0; p3<stretched.length; p3++, j3+=4){
        var vv = stretched[p3];
        od[j3]=od[j3+1]=od[j3+2]=vv; od[j3+3]=255;
      }
    }
    ctx.putImageData(out,0,0);
  }

  binarizeToggle.addEventListener('click', function(){
    binarizeOn = !binarizeOn;
    binarizeToggle.classList.toggle('active', binarizeOn);
    binarizeParams.style.display = binarizeOn ? 'flex' : 'none';
    if (channelValues) render();
  });
  sensSlider.addEventListener('input', function(){
    sensVal.textContent = sensSlider.value;
    if (channelValues) render();
  });

  chips.forEach(function(chip){
    chip.addEventListener('click', function(){
      chips.forEach(function(c){ c.classList.remove('active'); });
      chip.classList.add('active');
      activeChannel = chip.dataset.ch;
      if (originalImageData) pickBestChannelAndCompute();
    });
  });

  blackSlider.addEventListener('input', function(){
    blackVal.textContent = blackSlider.value;
    render();
  });
  whiteSlider.addEventListener('input', function(){
    whiteVal.textContent = whiteSlider.value;
    render();
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    originalImageData = null;
    channelValues = null;
    capturedFrames = [];
    fixedW = null; fixedH = null;
    frameCountBox.style.display = 'none';
    averageBtn.style.display = 'none';
    confidenceCache = null;
    suggestionsBox.style.display = 'none';
    fullImageData = null;
    stage.classList.remove('active');
    imageWrap.classList.remove('active');
    document.querySelector('main').classList.remove('photo-active');
    emptyState.style.display = 'block';
    fileInput.value = '';
  });
})();
</script>
